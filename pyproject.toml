[project]
name = "adaptive-iot-honeypot"
version = "1.0.0"
description = "Adaptive IoT honeypot with behaviour logging and attack classification"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert in tests
    "S104",  # binding to all interfaces is a deliberate deployment choice
    "S608",  # SQL is built from fixed column names only; values are bound
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"services/shell_emulator.py" = ["S108"]  # paths inside the fake filesystem
